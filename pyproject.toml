# =============================================================================
# Daylio API Server — project metadata and tooling configuration
# -----------------------------------------------------------------------------
# Project: daylio-api-server v2.0.0  (see version.ini for release versioning)
# Stack   : Python 3.14+, Flask 3.x, Waitress, APScheduler, PyYAML, no pandas
# Tooling : ruff (lint) + pytest (tests) + pip-tools (dependency locking)
# =============================================================================

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daylio-api-server"
version = "2.0.0"
description = "Multi-user Daylio server: unified CSV/.daylio import, dual storage (SQLite source of truth + InfluxDB 2.x for analytics), parametric REST API and Influx-only dashboard (Flask + Waitress)."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Daylio API Server team" }]
keywords = ["daylio", "flask", "influxdb", "sqlite", "csv", "api", "dashboard"]
dependencies = [
    "flask>=3.0",
    "waitress>=3.0",
    "influxdb-client>=1.40",
    "itsdangerous>=2.1",
    "werkzeug>=3.0",
    "PyYAML>=6.0",
    "APScheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pip-tools>=7.4",
]

[project.urls]
Repository = "https://gitea.example.org/tanadelgigante/daylio-api-server"
Documentation = "https://gitea.example.org/tanadelgigante/daylio-api-server/wiki"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
# FASE 7 (Task 7.1, D18/R16): tests marked `influx` need a REAL InfluxDB 2.x.
# The CI `test` job exports INFLUX_URL (built from vars.INFLUX_INSTANCE,
# "<ip>:<port>") + INFLUX_TOKEN when the endpoint is configured, and runs the
# full suite; otherwise it sets CI_SKIP_INFLUX=1 and runs `-m "not influx"`.
# Every test using tests/fakes.FakeInfluxClient stays un-marked and always runs.
markers = [
    "influx: requires a reachable InfluxDB 2.x (INFLUX_URL/INFLUX_INSTANCE + INFLUX_TOKEN); skipped when not configured or CI_SKIP_INFLUX=1",
]
